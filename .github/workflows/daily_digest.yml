name: Daily AI News Aggregator & Emailer

on:
  schedule:
    # Runs every day at 06:00 UTC (11:30 AM IST)
    - cron: '0 6 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openai pydantic python-dotenv feedparser beautifulsoup4 markdown markdownify sqlalchemy youtube-transcript-api

      - name: Initialize Database
        env:
          USE_POSTGRES: "false"
        run: |
          python app/database/create_tables.py

      - name: Run AI News Pipeline
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: "groq/compound-mini"
          MY_EMAIL: ${{ secrets.MY_EMAIL }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
          USE_POSTGRES: "false"
        run: |
          python main.py
